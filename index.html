.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 64px; padding-top: 22px; border-top: 1px solid var(--line); }

function fnv(s) {
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).padStart(8, '0').slice(0, 7);
}
POSTS.forEach(function (p) {
  p.hash = fnv(p.slug);
  var n = 0, c = 0;
  p.body.forEach(function (b) {
    if (b[0] === 'p') n += b[1].length;
    else if (b[0] === 'ul') n += b[1].join('').length;
    else if (b[0] === 'code') c += b[2].split('\n').length;
  });
  p.mins = Math.max(2, Math.round(n / 420 + c / 12));
});

/* ---------- 代码高亮：只区分注释和字符串 ---------- */

var LANG = { sql: 'SQL', sh: 'Shell', go: 'Go', py: 'Python', js: 'JavaScript', ini: 'systemd' };
var RES = {
  sql: /(--.*)|('[^'\n]*'|"[^"\n]*")/g,
  js: /(\/\/.*)|('[^'\n]*'|"[^"\n]*")/g,
  go: /(\/\/.*)|('[^'\n]*'|"[^"\n]*")/g,
  py: /(#.*)|('[^'\n]*'|"[^"\n]*")/g,
  sh: /(#.*)|('[^'\n]*'|"[^"\n]*")/g,
  ini: /(#.*)|('[^'\n]*'|"[^"\n]*")/g
};
function hl(lang, src) {
  var re = RES[lang], out = '', last = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    out += m[1] !== undefined ? '<span class="cmt">' + esc(m[1]) + '</span>' : '<span class="str">' + esc(m[2]) + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeHTML(lang, src, cap) {
  return '<figure class="code"><figcaption><span>' + esc(cap || LANG[lang]) + '</span>' +
    '<button class="copy" type="button">复制</button></figcaption>' +
    '<pre><code>' + hl(lang, src) + '</code></pre></figure>';
}

/* ---------- 状态 ---------- */

var view = $('#view'), head = $('#head'), bar = $('#bar');
var current = null, active = 'all', reveal = 0, played = false, GP = null, listY = 0, ro = null, rq = 0;

/* ---------- 首页 ---------- */

function homeHTML() {
  var counts = { all: POSTS.length };
  POSTS.forEach(function (p) { counts[p.branch] = (counts[p.branch] || 0) + 1; });
  var chips = CHIPS.map(function (k) {
    var name = k === 'all' ? '全部' : BR[k].name;
    var dot = k === 'all' ? '' : '<i class="dot" style="background:var(' + BR[k].color + ')"></i>';
    return '<button class="chip" type="button" data-k="' + k + '" aria-pressed="' + (k === active) + '">' +
      dot + name + '<span class="n">' + (counts[k] || 0) + '</span></button>';
  }).join('');
  var rows = POSTS.map(function (p, i) {
    var b = BR[p.branch];
    return '<li class="commit" data-i="' + i + '" data-b="' + p.branch + '" style="--c:var(' + b.color + ')">' +
      '<div class="meta"><span>' + p.hash + '</span><span>' + p.date + '</span>' +
      '<span class="br"><i class="dot" style="background:var(--c)"></i>' + b.name + '</span>' +
      (i === 0 ? '<span class="headb">HEAD</span>' : '') + '</div>' +
      '<h2><a href="#' + p.slug + '">' + esc(p.title) + '</a></h2>' +
      '<p class="sum">' + esc(p.sum) + '</p>' +
      '<p class="foot">' + p.mins + ' 分钟读完</p></li>';
  }).join('');
  return '<section class="intro">' +
    '<h1 class="lede">写后端，也写点工具。这里记排查的过程，结论放在最前面。</h1>' +
    '<p class="sub">我是 langrain，白天写后端服务，晚上折腾小工具。文章写完才发，不定期更新。</p>' +
    '<div class="chips" role="group" aria-label="按分支筛选">' + chips + '</div></section>' +
    '<section class="log" id="log"><svg id="graph" aria-hidden="true"></svg>' +
    '<ol class="commits" id="commits">' + rows + '</ol></section>' +
    '<section class="about" id="about"><h2>关于</h2>' +
    '<p>我叫 langrain，做后端开发，主要写 Go，数据库用得最多的是 SQLite 和 PostgreSQL。</p>' +
    '<p>这个站点是单个 HTML 文件，没有构建步骤。文章都在脚本顶部的 POSTS 数组里，加一篇就是往数组最前面加一项。</p>' +
    '<dl><dt>语言</dt><dd>Go、Python，偶尔写 JavaScript</dd>' +
    '<dt>数据库</dt><dd>SQLite、PostgreSQL</dd>' +
    '<dt>系统</dt><dd>Debian、systemd</dd></dl></section>';
}

function drawGraph() {
  var ol = $('#commits'), svg = $('#graph');
  if (!ol || !svg) return;
  var narrow = innerWidth < 520;
  var x0 = narrow ? 10 : 12, step = narrow ? 12 : 16;
  var W = x0 * 2 + step * 3;
  root.style.setProperty('--rail-pad', (W + (narrow ? 14 : 24)) + 'px');
  var H = ol.offsetHeight;
  var lis = $$('.commit', ol);
  var pts = lis.map(function (li, i) {
    var m = $('.meta', li);
    var b = POSTS[i].branch;
    return { y: li.offsetTop + m.offsetTop + m.offsetHeight / 2, b: b, lane: BR[b].lane };
  });
  var X = function (l) { return x0 + l * step; };
  var R = 22, ghost = '', live = '', nodes = '';

  var trunk = 'M' + X(0) + ' 0V' + (H - 20);
  ghost += '<path class="gp" data-b="trunk" d="' + trunk + '" style="stroke:var(--l0)"/>';
  live += '<path class="p" data-b="trunk" d="' + trunk + '" style="stroke:var(--l0)"/>';

  ['db', 'debug', 'fe'].forEach(function (k) {
    var mine = pts.filter(function (p) { return p.b === k; });
    if (!mine.length) return;
    var top = Math.min.apply(null, mine.map(function (p) { return p.y; }));
    var bot = Math.max.apply(null, mine.map(function (p) { return p.y; }));
    var x = X(BR[k].lane), tx = X(0);
    var mt = Math.max(top - R, 2), ym = (top + mt) / 2;
    var yb = bot + R, yf = (bot + yb) / 2;
    var d = 'M' + x + ' ' + top + 'V' + bot +
      'M' + tx + ' ' + yb + 'C' + tx + ' ' + yf + ' ' + x + ' ' + yf + ' ' + x + ' ' + bot +
      'M' + x + ' ' + top + 'C' + x + ' ' + ym + ' ' + tx + ' ' + ym + ' ' + tx + ' ' + mt;
    var st = 'stroke:var(' + BR[k].color + ')';
    ghost += '<path class="gp" data-b="' + k + '" d="' + d + '" style="' + st + '"/>';
    live += '<path class="p" data-b="' + k + '" d="' + d + '" style="' + st + '"/>';
  });

  pts.forEach(function (p, i) {
    var cx = X(p.lane), col = BR[p.b].color;
    ghost += '<circle class="gnode" data-b="' + p.b + '" cx="' + cx + '" cy="' + p.y + '" r="4" style="stroke:var(' + col + ')"/>';
    var fill = i === 0 ? ';fill:var(' + col + ')' : '';
    nodes += '<circle class="node" data-i="' + i + '" data-b="' + p.b + '" cx="' + cx + '" cy="' + p.y + '" r="5.5" style="stroke:var(' + col + ')' + fill + '"/>';
    if (i === 0) nodes += '<circle class="pulse" cx="' + cx + '" cy="' + p.y + '" r="5.5" style="stroke:var(' + col + ')"/>';
  });

  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML = '<defs><clipPath id="rv"><rect id="rvr" x="-30" y="0" width="' + (W + 60) + '" height="0"/></clipPath></defs>' +
    '<g>' + ghost + '</g><g clip-path="url(#rv)">' + live + '</g><g>' + nodes + '</g>';
  GP = { pts: pts, H: H };
  applyFilter();
  setReveal(reveal);
}

function setReveal(v) {
  if (!GP) return;
  reveal = clamp(v, 0, GP.H);
  var r = $('#rvr');
  if (r) r.setAttribute('height', reveal);
  $$('#graph .node').forEach(function (n) {
    n.classList.toggle('on', GP.pts[+n.getAttribute('data-i')].y <= reveal + 6);
  });
}
function targetReveal() {
  var log = $('#log');
  if (!log || !GP) return 0;
  var atEnd = innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
  if (atEnd) return GP.H;
  return clamp(innerHeight * 0.82 - log.getBoundingClientRect().top, 0, GP.H);
}
function introReveal() {
  if (reduced) { setReveal(targetReveal()); return; }
  var t0 = performance.now(), dur = 1100;
  (function f(now) {
    if (current !== 'home') return;
    var t = clamp((now - t0) / dur, 0, 1);
    var e = 1 - Math.pow(1 - t, 3);
    setReveal(Math.max(reveal, e * targetReveal()));
    if (t < 1) requestAnimationFrame(f);
  })(t0);
}

function applyFilter() {
  $$('.commit', view).forEach(function (li) {
    li.classList.toggle('dim', active !== 'all' && li.getAttribute('data-b') !== active);
  });
  $$('#graph [data-b]').forEach(function (el) {
    var b = el.getAttribute('data-b');
    el.classList.toggle('dim', active !== 'all' && b !== active && b !== 'trunk');
  });
}

function hot(e, on) {
  var li = e.target.closest && e.target.closest('.commit');
  if (!li) return;
  var n = $('#graph .node[data-i="' + li.getAttribute('data-i') + '"]');
  if (n) n.classList.toggle('hot', on);
}

function mountHome() {
  $$('.chip', view).forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.getAttribute('data-k');
      active = (active === k && k !== 'all') ? 'all' : k;
      $$('.chip', view).forEach(function (c) { c.setAttribute('aria-pressed', String(c.getAttribute('data-k') === active)); });
      applyFilter();
    });
  });
  var ol = $('#commits');
  ol.addEventListener('mouseover', function (e) { hot(e, true); });
  ol.addEventListener('mouseout', function (e) { hot(e, false); });
  ol.addEventListener('focusin', function (e) { hot(e, true); });
  ol.addEventListener('focusout', function (e) { hot(e, false); });
  drawGraph();
  if (!played) { played = true; reveal = 0; setReveal(0); introReveal(); }
  else setReveal(Math.max(reveal, targetReveal()));
  if (window.ResizeObserver) {
    ro = new ResizeObserver(function () {
      if (rq) return;
      rq = requestAnimationFrame(function () { rq = 0; drawGraph(); });
    });
    ro.observe(ol);
  }
}

/* ---------- 文章页 ---------- */

function postHTML(i) {
  var p = POSTS[i], b = BR[p.branch], n = 0, toc = [];
  var body = p.body.map(function (x) {
    if (x[0] === 'h') { n++; toc.push(x[1]); return '<h2 id="s' + n + '">' + esc(x[1]) + '</h2>'; }
    if (x[0] === 'p') return '<p>' + inline(x[1]) + '</p>';
    if (x[0] === 'ul') return '<ul>' + x[1].map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</ul>';
    return codeHTML(x[1], x[2], x[3]);
  }).join('');
  var newer = POSTS[i - 1], older = POSTS[i + 1];
  var pg = function (q, cls, label) {
    return q ? '<a class="pg ' + cls + '" href="#' + q.slug + '"><small>' + label + '</small><b>' + esc(q.title) + '</b></a>' : '<span></span>';
  };
  var tocHTML = toc.length ? '<aside class="toc" aria-label="本文目录"><nav><ul>' +
    toc.map(function (t, k) { return '<li><button type="button" data-s="' + (k + 1) + '">' + esc(t) + '</button></li>'; }).join('') +
    '</ul></nav></aside>' : '';
  return '<article class="post">' + tocHTML +
    '<a class="back" href="#"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2.5 4.5 7 9 11.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>文章列表</a>' +
    '<div class="meta"><span>' + p.hash + '</span><span>' + p.date + '</span>' +
    '<span class="br"><i class="dot" style="background:var(' + b.color + ')"></i>' + b.name + '</span>' +
    '<span>' + p.mins + ' 分钟读完</span></div>' +
    '<h1>' + esc(p.title) + '</h1><p class="dek">' + esc(p.sum) + '</p>' +
    '<div class="prose">' + body + '</div>' +
    '<nav class="pager" aria-label="相邻文章">' + pg(newer, 'prev', '较新') + pg(older, 'next', '较旧') + '</nav></article>';
}

function mountPost() {
  $$('.copy', view).forEach(function (btn) {
    btn.addEventListener('click', function () {
      var code = $('code', btn.closest('.code'));
      var reset = function () { setTimeout(function () { btn.textContent = '复制'; btn.classList.remove('ok'); }, 1400); };
      var done = function () { btn.textContent = '已复制'; btn.classList.add('ok'); reset(); };
      var fallback = function () {
        var r = document.createRange(); r.selectNodeContents(code);
        var s = getSelection(); s.removeAllRanges(); s.addRange(r);
        btn.textContent = '已选中'; reset();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code.textContent).then(done, fallback);
      else fallback();
    });
  });
  $$('.toc button', view).forEach(function (b) {
    b.addEventListener('click', function () {
      var h = $('#s' + b.getAttribute('data-s'));
      if (h) h.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    });
  });
  onScroll();
}

/* ---------- 路由 ---------- */

function show(kind, i) {
  current = kind;
  if (ro) { ro.disconnect(); ro = null; }
  GP = null;
  bar.hidden = kind !== 'post';
  bar.style.transform = 'scaleX(0)';
  view.innerHTML = kind === 'home' ? homeHTML() : postHTML(i);
  view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  if (kind === 'home') mountHome(); else mountPost();
}

function route() {
  var h = decodeURIComponent(location.hash.slice(1));
  var i = POSTS.findIndex(function (p) { return p.slug === h; });
  if (i >= 0) {
    if (current === 'home') listY = window.scrollY;
    show('post', i);
    window.scrollTo(0, 0);
    return;
  }
  var wasPost = current === 'post';
  if (current !== 'home') show('home');
  if (h === 'about') {
    var a = $('#about');
    if (a) requestAnimationFrame(function () { a.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); });
  } else if (wasPost) {
    window.scrollTo(0, listY);
  } else {
    window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
  }
}

/* ---------- 滚动 ---------- */

function onScroll() {
  head.classList.toggle('stuck', window.scrollY > 8);
  if (current === 'home') {
    if (played) setReveal(Math.max(reveal, targetReveal()));
  } else if (current === 'post') {
    var a = $('.post', view);
    if (!a) return;
    var r = a.getBoundingClientRect();
    var p = clamp((-r.top) / Math.max(1, r.height - innerHeight * 0.55), 0, 1);
    bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    var idx = -1;
    $$('.prose h2', view).forEach(function (h, k) { if (h.getBoundingClientRect().top <= 120) idx = k; });
    $$('.toc li', view).forEach(function (li, k) { li.classList.toggle('on', k === idx); });
  }
}
var tick = false;
addEventListener('scroll', function () {
  if (tick) return;
  tick = true;
  requestAnimationFrame(function () { tick = false; onScroll(); });
}, { passive: true });

/* ---------- 主题 ---------- */

var themeBtn = $('#theme');
function isDark() {
  var a = root.getAttribute('data-theme');
  return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
try {
  var saved = localStorage.getItem('theme');
  if (saved && !root.getAttribute('data-theme')) root.setAttribute('data-theme', saved);
} catch (e) {}
themeBtn.addEventListener('click', function () {
  var next = isDark() ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  themeBtn.classList.toggle('flip');
  try { localStorage.setItem('theme', next); } catch (e) {}
});

/* ---------- 启动 ---------- */

$('#foot').textContent = '© ' + new Date().getFullYear() + ' langrain';
addEventListener('hashchange', route);
addEventListener('resize', function () { if (current === 'home' && !rq) rq = requestAnimationFrame(function () { rq = 0; drawGraph(); }); });
route();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () { if (current === 'home') drawGraph(); });
}
})();
</script>

<script id="data" type="application/json">[{"slug":"p-mw63c9ue","branch":"life","date":"2026-11-07","title":"Daily life","sum":"","md":"​今天醒得比平时稍早一些。没有闹钟的催促，推开窗，微凉的空气里带着一丝秋日独有的清爽\n```Rust\nprintln!(\"2\");\n```"},{"slug":"p-mw634p9f","branch":"life","date":"2026-11-07","title":"你好","sum":"那你呢","md":"你好，我是一个\n\n## 我的天哪\n`println!(\"Hello World!)`"},{"slug":"hello","branch":"life","date":"2026-11-01","title":"这里开张了","sum":"我一直喜欢写代码。写的时候会碰到各种小问题，解决完就忘，下次又碰到。所以想有个地方记下来。","md":"我一直喜欢写代码。写的时候会碰到各种小问题，解决完就忘，下次又碰到。所以想有个地方记下来。\n\n除了代码，平时的日子也想留几笔：吃了什么、去了哪、哪天心情不错。这些以后翻起来，比代码有意思。\n\n文章没有固定的更新时间，想写了就写，写完再发。"},{"slug":"wal-checkpoint","branch":"code","date":"2026-10-18","title":"WAL 文件涨到 3GB，凶手是一个没结束的读事务","sum":"数据库本体才 200MB，旁边的 -wal 文件却一直涨。checkpoint 被一个长时间开着的读连接挡住了。","md":"服务跑了两周，数据库本体 200MB，旁边的 `app.db-wal` 却有 3GB。先说结论：有个读连接一直开着事务，checkpoint 没法越过它，WAL 只能不断往后追加，没法从头复用。\n\n## 先确认是不是 checkpoint 没跑完\n\n`PRAGMA wal_checkpoint(PASSIVE)` 返回三个数：busy、WAL 里的总页数、已经写回主库的页数。后两个差得越多，积压越多。\n\n```sql\nPRAGMA wal_checkpoint(PASSIVE);\n-- busy | log    | checkpointed\n--    0 | 786432 | 1024\n```\n\n786432 页乘以 4096 字节正好是 3GB，而写回主库的只有 1024 页。\n\n## 为什么会这样\n\nWAL 模式下，读事务开始时会记下 WAL 当时的末尾位置，之后这个读者看到的就是那一刻的快照。checkpoint 只能把这个位置之前的页写回主库，而且要等所有读者都不再依赖旧页，才能从 WAL 开头重新写。一个不结束的读事务，就把这个位置钉住了。\n\n我这里的读连接是个导出任务：用游标一行行读，中间还要调外部接口，一个事务开了十几个小时。\n\n## 处理\n\n先把导出任务停掉，再手动收一次：\n\n```sql\nPRAGMA wal_checkpoint(TRUNCATE);\n```\n\n`TRUNCATE` 会等写者和读者都让开，把所有页写回主库，再把 WAL 截成 0 字节。读者一直不走的话它会返回 busy，设了 `busy_timeout` 就等到超时。所以治本的办法是改任务：每批取 1000 行就提交，用 `WHERE id > ?` 翻页，不用长游标。\n\n还有一点。`wal_autocheckpoint` 默认是 1000 页，只在提交时尝试一次不阻塞的 checkpoint，被读者挡住就放弃，也不报错。这个问题在日志里看不到，我现在直接监控 `-wal` 文件的大小。"},{"slug":"tcp-40ms","branch":"tinker","date":"2026-09-30","title":"请求固定多出 40ms，是 Nagle 和延迟确认撞上了","sum":"一个内部服务 p50 稳定在 41ms，抓包发现客户端把一个请求拆成了两次 write。","md":"一个内部小服务，本机压测单次请求 1ms，放到测试环境 p50 却稳定在 41ms。数字这么整齐，多半不是业务慢，而是哪里有个定时器在等。\n\n## 抓包\n\n在服务端抓一次请求，用 `-ttt` 看包与包之间的间隔：\n\n```sh\ntcpdump -i eth0 -nn -ttt port 9000\n```\n\n客户端先发来 4 字节的长度头，隔了约 40ms，才发正文。这 40ms 里服务端一直没有回 ACK。\n\n## 两个机制互相等\n\n客户端是 Python，默认开着 Nagle 算法：前一个小包还没收到确认，后面的小数据就先攒着。服务端内核开着延迟确认：收到一个小包不马上 ACK，最多等 40ms（Linux 的下限），指望顺带在响应里捎上。客户端等 ACK 才发正文，服务端等正文才响应，谁都不动，直到服务端的定时器到点。\n\n## 改法\n\n根本的问题是把一条消息拆成了两次 `send`。先把长度头和正文拼在一起一次发出去，再把 `TCP_NODELAY` 打开，免得以后有人又拆开：\n\n```py\nsock = socket.create_connection((host, 9000))\nsock.setsockopt(socket.IPPROTO_TCP, socket.TCP_NODELAY, 1)\nsock.sendall(header + body)  # 一次写完\n```\n\np50 回到了 1.3ms。Go 的 net 包默认就开着 NoDelay，所以同样的问题在 Go 写的客户端里很少见，换一种语言写客户端才碰上。"},{"slug":"systemd-timer","branch":"tinker","date":"2026-09-02","title":"把 cron 换成 systemd timer 之后","sum":"半年里 cron 任务静默失败了三次。换成 timer，日志和补跑都有地方管了。","md":"我有几个定时任务：备份数据库、清理上传目录、给自己发周报。以前都放在 crontab 里，直到有一次备份脚本因为 PATH 不对失败了，整整九天没人发现。\n\n## 一个最小的例子\n\n一个任务要两个文件，一个描述做什么，一个描述什么时候做。\n\n```ini backup.service\n[Unit]\nDescription=Backup app database\n\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/backup.sh\n```\n\n```ini backup.timer\n[Unit]\nDescription=Backup app database, daily\n\n[Timer]\nOnCalendar=*-*-* 03:30:00\nPersistent=true\nRandomizedDelaySec=300\n\n[Install]\nWantedBy=timers.target\n```\n\n```sh\nsystemctl enable --now backup.timer\nsystemctl list-timers backup.timer\njournalctl -u backup.service -n 20\n```\n\n`Persistent=true` 的意思是：如果机器在 3:30 关着，开机后补跑一次。cron 没有这个行为，要靠 anacron。`list-timers` 能看到下次什么时候跑、上次什么时候跑。输出进了 journal，`journalctl -u backup.service` 就是这个任务的全部日志，不用再往文件里重定向。\n\n## 不太顺手的地方\n\n一个简单任务要写两个文件，比一行 crontab 啰嗦得多。`OnCalendar` 的语法也要学一遍，好在可以先验证再用：`systemd-analyze calendar \"Mon *-*-* 09:00\"`。失败通知默认没有，我在 `[Unit]` 里加了 `OnFailure=`，指向一个发消息的 service。"},{"slug":"sqlite-affinity","branch":"code","date":"2026-08-11","title":"往 INTEGER 列里存「007」，取出来是 7","sum":"SQLite 的列类型只是亲和性，不是约束。STRICT 表可以把类型管严。","md":"有张表的 `code` 列我声明成了 INTEGER，里面存门店编号，有些以 0 开头。导入数据之后发现，「007」变成了 7。\n\n## 发生了什么\n\nSQLite 的列类型叫类型亲和性，是建议，不是约束。INTEGER 亲和性的列遇到看起来像整数的文本，会先转成整数再存。「007」能无损地转成 7，于是就转了。\n\n```sql\nCREATE TABLE shop (code INTEGER);\nINSERT INTO shop VALUES ('007');\nSELECT code, typeof(code) FROM shop;\n-- 7 | integer\n```\n\n反过来，往 INTEGER 列里存 `'abc'` 不会报错，它就原样存成文本。\n\n## 两种办法\n\n编号就是字符串，列声明成 TEXT。以后遇到看起来是数字、但不参与计算的字段，比如邮编、手机号、编号，一律用 TEXT。\n\n另一个办法是 3.37 以后支持的 STRICT 表，类型对不上直接报错：\n\n```sql\nCREATE TABLE shop (code TEXT NOT NULL, floor INTEGER) STRICT;\nINSERT INTO shop VALUES ('007', 'abc');\n-- 报错：cannot store TEXT value in INTEGER column shop.floor\n```\n\nSTRICT 表的列类型只能是 INT、INTEGER、REAL、TEXT、BLOB、ANY 这几种，原来写的 `VARCHAR(20)` 之类要改掉。老版本的 SQLite 打不开带 STRICT 表的库，部署前先确认运行环境的版本。"},{"slug":"raf-layout","branch":"code","date":"2026-07-20","title":"动画循环里读 offsetHeight，布局被反复重算","sum":"在 requestAnimationFrame 里交替读写样式，浏览器每读一次就得同步布局一次。","md":"做一个列表拖拽排序，帧率只有 12fps。火焰图里全是 Layout，每个元素一次。\n\n## 读和写交替\n\n```js\nfor (const el of items) {\n  const h = el.offsetHeight;                       // 读：要最新的布局\n  el.style.transform = 'translateY(' + h + 'px)';  // 写：让布局失效\n}\n```\n\n浏览器会把样式修改攒起来，渲染时一起算。但 `offsetHeight` 要的是此刻的真实值，前面如果有还没处理的样式修改，就得立刻同步算一次布局。循环里读一次写一次，N 个元素就是 N 次布局。\n\n## 拆开\n\n```js\nconst heights = items.map(el => el.offsetHeight);  // 先一次读完\nitems.forEach((el, i) => {\n  el.style.transform = 'translateY(' + heights[i] + 'px)';  // 再一次写完\n});\n```\n\n改完每帧只布局一次，帧时间从 80ms 左右降到 6ms 左右。位移我也从 `top` 换成了 `transform`：transform 不触发布局，只走合成。"},{"slug":"go-rss","branch":"tinker","date":"2026-06-05","title":"Go 服务的内存占用下不来，先看哪几个数","sum":"RSS 降不下去不一定是泄漏。先分清 HeapInuse、HeapIdle 和 HeapReleased。","md":"监控里有个 Go 服务，RSS 稳在 1.8GB，流量低谷也不降。第一反应是泄漏，但 pprof 里 inuse_space 只有 300MB 左右。\n\n## 三个数\n\n`runtime.MemStats` 里最有用的是这三个：\n\n- `HeapInuse`：正在被对象使用的 span，对应 pprof 里看到的 inuse。\n- `HeapIdle`：已经没有对象、但还留在 Go 运行时手里的 span。\n- `HeapReleased`：Idle 里已经还给操作系统的那一部分。\n\n```go\nvar m runtime.MemStats\nruntime.ReadMemStats(&m)\nfmt.Println(m.HeapInuse>>20, m.HeapIdle>>20, m.HeapReleased>>20) // MB\n```\n\n`HeapIdle - HeapReleased` 是运行时手里留着没还的内存，它仍然算在 RSS 里。我这里这个差值接近 1.3GB，是一次批量任务之后留下的。\n\n运行时的后台回收会慢慢把 Idle 还给系统，速度有限，所以批量任务结束后几分钟内 RSS 不降是正常的。真正该担心的是 `HeapInuse` 一路往上涨。\n\n## 后来怎么处理\n\n批量任务本身一次读了 200 万行再处理，我改成了分批，峰值降到原来的五分之一。如果确实需要立刻归还，可以调 `debug.FreeOSMemory()`，但它会触发一次完整的 GC，我只在任务结束的位置调了一次。"}]</script>

/* 正文写法：## 小标题；空行分段；- 列表；```语言 围起来的是代码；`行内代码`
   图片：!img:资源ID|说明　视频：!video:资源ID|说明　附件：!file:资源ID|文件名|字节数（编辑器的按钮会自动写入） */
var MEDIA = /^!(img|video|file):([A-Za-z0-9]{32}|uploads\/[A-Za-z0-9._-]+)((?:\|[^\n]*)?)\s*$/;
var CJK = /[　-鿿＀-￯]/;
function joinLines(a, b) { return (CJK.test(a.slice(-1)) || CJK.test(b.charAt(0))) ? a + b : a + ' ' + b; }
function parseMd(md) {
  var lines = String(md || '').replace(/\r\n?/g, '\n').split('\n'), n = lines.length, i = 0, out = [];
  while (i < n) {
    var line = lines[i];
    if (/^```/.test(line)) {
      var info = line.slice(3).trim().split(/\s+/), buf = [];
      i++;
      while (i < n && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push(['code', info[0] || 'text', buf.join('\n'), info.slice(1).join(' ') || undefined]);
    } else if (MEDIA.test(line)) {
      var mm = line.trim().match(MEDIA), parts = (mm[3] || '').slice(1).split('|');
      out.push(['media', mm[1], mm[2], parts[0], parts.slice(1)]); i++;
    } else if (/^##\s+/.test(line)) {
      out.push(['h', line.replace(/^##\s+/, '').trim()]); i++;
    } else if (/^[-*]\s+/.test(line)) {
      var items = [];
      while (i < n && /^[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^[-*]\s+/, '').trim()); i++; }
      out.push(['ul', items]);
    } else if (!line.trim()) {
      i++;
    } else {
      var para = '';
      while (i < n && lines[i].trim() && !/^(```|##\s|[-*]\s)/.test(lines[i]) && !MEDIA.test(lines[i])) {
        para = para ? joinLines(para, lines[i].trim()) : lines[i].trim(); i++;
      }
      out.push(['p', para]);
    }
  }
  return out;
}

function drawGraph() {
  var ol = $('#commits'), svg = $('#graph');
  if (!ol || !svg) return;
  var narrow = innerWidth < 520;
  var x0 = narrow ? 10 : 12, step = narrow ? 12 : 16;
  var W = x0 * 2 + step * 2;
  root.style.setProperty('--rail-pad', (W + (narrow ? 14 : 24)) + 'px');
  var H = ol.offsetHeight;
  var lis = $$('.commit', ol);
  var pts = lis.map(function (li, i) {
    var m = $('.meta', li);
    var b = POSTS[i].branch;
    return { y: li.offsetTop + m.offsetTop + m.offsetHeight / 2, b: b, lane: BR[b].lane };
  });
  var X = function (l) { return x0 + l * step; };
  var R = 22, ghost = '', live = '', nodes = '';

  var trunk = 'M' + X(0) + ' 0V' + Math.max(H - 20, 0);
  ghost += '<path class="gp" data-b="trunk" d="' + trunk + '" style="stroke:var(--l0)"/>';
  live += '<path class="p" data-b="trunk" d="' + trunk + '" style="stroke:var(--l0)"/>';

  ['code', 'tinker'].forEach(function (k) {
    var mine = pts.filter(function (p) { return p.b === k; });
    if (!mine.length) return;
    var top = Math.min.apply(null, mine.map(function (p) { return p.y; }));
    var bot = Math.max.apply(null, mine.map(function (p) { return p.y; }));
    var x = X(BR[k].lane), tx = X(0);
    var mt = Math.max(top - R, 2), ym = (top + mt) / 2;
    var yb = bot + R, yf = (bot + yb) / 2;
    var d = 'M' + x + ' ' + top + 'V' + bot +
      'M' + tx + ' ' + yb + 'C' + tx + ' ' + yf + ' ' + x + ' ' + yf + ' ' + x + ' ' + bot +
      'M' + x + ' ' + top + 'C' + x + ' ' + ym + ' ' + tx + ' ' + ym + ' ' + tx + ' ' + mt;
    var st = 'stroke:var(' + BR[k].color + ')';
    ghost += '<path class="gp" data-b="' + k + '" d="' + d + '" style="' + st + '"/>';
    live += '<path class="p" data-b="' + k + '" d="' + d + '" style="' + st + '"/>';
  });

  pts.forEach(function (p, i) {
    var cx = X(p.lane), col = BR[p.b].color;
    ghost += '<circle class="gnode" data-b="' + p.b + '" cx="' + cx + '" cy="' + p.y + '" r="4" style="stroke:var(' + col + ')"/>';
    var fill = i === 0 ? ';fill:var(' + col + ')' : '';

    if (i === 0) nodes += '<circle class="pulse" cx="' + cx + '" cy="' + p.y + '" r="5.5" style="stroke:var(' + col + ')"/>';

  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML = '<defs><clipPath id="rv"><rect id="rvr" x="-30" y="0" width="' + (W + 60) + '" height="0"/></clipPath></defs>' +
    '<g>' + ghost + '</g><g clip-path="url(#rv)">' + live + '</g><g>' + nodes + '</g>';
  GP = { pts: pts, H: H };

  setReveal(reveal);
}

    '<textarea id="f-md" spellcheck="false" aria-label="正文"></textarea><div class="pv prose" id="f-pv" hidden></div></div>' +
    '<p class="hint"><code>## 小标题</code>　空行分段　<code>- </code>开头是列表　<code>`行内代码`</code>　三个反引号加语言名围起来是代码块，比如 <code>```sql</code>　图片、视频、PDF 等点右上角的“插入图片或附件”，单个文件最大 20 MB</p>' +
    '<div class="actions"><button class="btn primary" type="button" id="b-pub">' + (p ? '保存修改' : '发布') + '</button>' +
    (p ? '<button class="btn danger" type="button" id="b-del">删除这篇</button>' : '') +
    '<span class="status" id="st" role="status"></span></div></div>';
}

var UP_TYPES = {
  png: ['image/png', 'img'], jpg: ['image/jpeg', 'img'], jpeg: ['image/jpeg', 'img'], gif: ['image/gif', 'img'],
  webp: ['image/webp', 'img'], svg: ['image/svg+xml', 'img'],
  mp4: ['video/mp4', 'video'], webm: ['video/webm', 'video'],
  pdf: ['application/pdf', 'file'], csv: ['text/csv', 'file'], md: ['text/markdown', 'file'],
  json: ['application/json', 'file'], txt: ['text/plain', 'file']
};
function upErr(e) {
  switch (e && e.code) {
    case 'too_large': return '文件太大。图片、视频、PDF 上限 20 MB，SVG 上限 2 MB。';
    case 'unsupported_type': return '这个文件的格式不被接受，或者内容和扩展名对不上。';
    case 'quota_or_state': return '这个页面的存储空间用完了，先换小一点的文件。';
    case 'rate_limited': return '上传太频繁了，过一会再试。';
    case 'invalid_request': return '文件是空的，或者文本文件不是 UTF-8 编码。';
    case 'not_granted': case 'capability_disabled': case 'capability_removed': return '这里现在不能上传文件。';
    case 'unsupported_ext': return '这种格式暂时不能上传。支持图片、mp4/webm 视频、PDF、csv、md、json、txt。';
    case 'gh_auth': return '令牌无效或已过期，请退出登录后重新登录。';
    case 'gh_perm': return '这个令牌没有仓库的写入权限，请退出登录后重新生成。';
    case 'gh_conflict': return '仓库里的文件刚被别处改过，刷新页面后再试。';
    default: return '上传失败，稍后再试一次。';
  }
}
function errMsg(e) {
  switch (e && e.code) {
    case 'conflict': return '页面刚刚被更新过，正在刷新。草稿还在，刷新后再点一次。';
    case 'not_writer': case 'not_granted': case 'consent_required': case 'capability_disabled':
    case 'capability_removed': case 'not_declared':
      return '这里现在不能保存。只有页面所有者在自己的页面里才能发布。';
    case 'too_large': return '页面超过了大小上限，先删掉一些旧文章再发。';
    case 'rate_limited': return '发布太频繁了，过一会再试。';
    case 'invalid_content': return '内容格式不对，没有发布。';
    case 'gh_auth': return '令牌无效或已过期，请退出登录后重新登录。';
    case 'gh_perm': return '这个令牌没有仓库的写入权限，请退出登录后重新生成。';
    case 'gh_conflict': return '仓库里的文章刚被别处改过，刷新页面后再试。';
    default: return '发布失败，稍后再试一次。';
  }
}

function mountEditor(i) {
  if (perm !== 'yes') { if (GH && perm !== 'pending') mountSetup(); return; }
  var p = i >= 0 ? POSTS[i] : null;
  var key = 'draft:' + (p ? p.slug : 'new');
  var F = { t: $('#f-title'), b: $('#f-br'), d: $('#f-date'), s: $('#f-sum'), m: $('#f-md') };
  var st = $('#st'), pub = $('#b-pub'), del = $('#b-del');
  var out = $('#b-out');
  if (out) out.addEventListener('click', function () { ghCfg.token = ''; ghSave(); perm = 'setup'; ghErr = ''; route(); });
  var init = p ? { title: p.title, branch: p.branch, date: p.date, sum: p.sum, md: p.md }
               : { title: '', branch: 'life', date: today(), sum: '', md: '' };
  var draft = null;
  try { draft = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
  if (draft && typeof draft === 'object') { init = Object.assign(init, draft); st.textContent = '已恢复没发出去的草稿。'; }
  F.t.value = init.title; F.b.value = BR[init.branch] ? init.branch : 'life'; F.d.value = init.date;
  F.s.value = init.sum || ''; F.m.value = init.md;
  if (p && !draft) F.s.value = (p.sum && p.sum !== autoSum(p)) ? p.sum : '';

  function read() {
    return { title: F.t.value.trim(), branch: F.b.value, date: F.d.value, sum: F.s.value.trim(), md: F.m.value.replace(/\s+$/, '') };
  }
  function saveDraft() { try { localStorage.setItem(key, JSON.stringify(read())); } catch (e) {} }
  [F.t, F.b, F.d, F.s, F.m].forEach(function (el) { el.addEventListener('input', function () { saveDraft(); st.textContent = ''; }); });

  var pv = $('#f-pv'), tw = $('#t-w'), tp = $('#t-p');
  function tab(preview) {
    tw.setAttribute('aria-pressed', String(!preview)); tp.setAttribute('aria-pressed', String(preview));
    F.m.hidden = preview; pv.hidden = !preview;
    if (preview) pv.innerHTML = bodyHTML(parseMd(F.m.value)).html || '<p style="color:var(--muted)">正文还是空的。</p>';
    if (preview) bindCopy(pv);
  }
  tw.addEventListener('click', function () { tab(false); });
  tp.addEventListener('click', function () { tab(true); });

  var up = $('#b-up'), fi = $('#f-file');
  if (up && fi) {
    up.addEventListener('click', function () { fi.click(); });
    fi.addEventListener('change', function () {
      var f = fi.files && fi.files[0]; fi.value = '';
      if (!f) return;
      up.disabled = true; st.textContent = '正在上传 ' + f.name + '…';
      getUploader()(f).then(function (r) {
        var cap = f.name.replace(/\.[^.]+$/, '').replace(/[|\n]/g, ' ').trim();
        var line = r.kind === 'file' ? '!file:' + r.id + '|' + f.name.replace(/[|\n]/g, ' ') + '|' + r.size
                 : '!' + r.kind + ':' + r.id + '|' + cap;
        var v = F.m.value, pos = F.m.selectionStart == null ? v.length : F.m.selectionStart;
        var before = v.slice(0, pos).replace(/\s*$/, ''), after = v.slice(pos).replace(/^\s*/, '');
        F.m.value = (before ? before + '\n\n' : '') + line + '\n\n' + after;
        F.m.hidden = false; pv.hidden = true; tw.setAttribute('aria-pressed', 'true'); tp.setAttribute('aria-pressed', 'false');
        saveDraft();
        st.textContent = '已上传，插入到正文里了。图片的说明可以直接改“|”后面的字。发布后才会对读者显示。';
      }, function (e) { st.textContent = upErr(e); }).then(function () { up.disabled = false; });
    });
  }

  function save(next, goto, btn) {
    pub.disabled = true; if (del) del.disabled = true;
    st.textContent = '正在发布…';
    if (GH) {
      ghPut('posts.json', b64(JSON.stringify(next, null, 1)), '更新文章').then(function () {
        POSTS = next.map(function (q) { return prep(Object.assign({}, q)); });
        try { localStorage.removeItem(key); } catch (e) {}
        if (decodeURIComponent(location.hash.slice(1)) === goto) route(); else location.hash = goto;
      }, function (e) {
        pub.disabled = false; if (del) del.disabled = false;
        st.textContent = errMsg({ code: ghCode(e) });
      });
      return;
    }
    try { sessionStorage.setItem('goto', goto); sessionStorage.setItem('clear', key); } catch (e) {}
    art.publish(buildDoc(next)).then(function () {
      st.textContent = '已发布，正在刷新…';
    }, function (e) {
      pub.disabled = false; if (del) del.disabled = false;
      try { sessionStorage.removeItem('goto'); sessionStorage.removeItem('clear'); } catch (_) {}
      st.textContent = errMsg(e);
    });
  }

  pub.addEventListener('click', function () {
    var v = read();
    if (!v.title) { st.textContent = '标题还没写。'; F.t.focus(); return; }
    if (!v.md) { st.textContent = '正文还没写。'; F.m.focus(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date)) v.date = today();
    var rec = { slug: p ? p.slug : 'p-' + Date.now().toString(36), branch: v.branch, date: v.date, title: v.title, sum: v.sum, md: v.md };
    var next = POSTS.map(plain);
    if (p) next[i] = rec; else next.unshift(rec);
    save(sortPosts(next), rec.slug, pub);
  });

  if (del) {
    var armed = 0;
    del.addEventListener('click', function () {
      if (!armed) {
        del.textContent = '再点一次，确认删除'; del.classList.add('arm');
        armed = setTimeout(function () { armed = 0; del.textContent = '删除这篇'; del.classList.remove('arm'); }, 4000);
        return;
      }
      clearTimeout(armed);
      var next = POSTS.map(plain).filter(function (_, k) { return k !== i; });
      save(next, '', del);
    });
  }
}
function autoSum(p) {
  var f = p.body.filter(function (b) { return b[0] === 'p'; })[0];
  var t = f ? f[1].replace(/`/g, '') : '';
  return t.length > 64 ? t.slice(0, 64) + '…' : t;
}

/* ---------- 权限 ---------- */

function applyPerm() {
  var w = $('#wlink'); if (w) w.hidden = perm !== 'yes';
  $$('[data-edit]').forEach(function (el) { el.hidden = perm !== 'yes'; });
}
function initCaps() {
  if (GH) {
    if (!ghCfg.token || !ghCfg.repo) { perm = 'setup'; return Promise.resolve(); }
    return ghCheck().then(function (ok) {
      perm = ok ? 'yes' : 'no';
      if (!ok) ghErr = '这个令牌对 ' + ghCfg.repo + ' 没有写入权限。';
    }, function (e) {
      perm = 'no';
      ghErr = e.status === 401 ? '令牌无效或已过期，请重新登录。' : e.status === 404 ? '找不到仓库 ' + ghCfg.repo + '，或令牌没有访问它的权限。' : '连不上 GitHub，稍后再试。';
    });
  }
  var optional = function (n) { return window.claude.use(n).then(function (v) { return v || null; }, function () { return null; }); };
  return Promise.all([window.claude.use('artifact'), window.claude.use('user'), optional('assets')]).then(function (r) {
    art = r[0]; assetsApi = r[2];
    if (!art || !r[1]) { perm = 'no'; return; }
    return r[1].canEdit().then(function (v) { perm = v ? 'yes' : 'no'; });
  }).catch(function () { perm = 'no'; });
}

/* ---------- 路由 ---------- */

function show(kind, i) {
  current = kind;
  if (ro) { ro.disconnect(); ro = null; }
  GP = null;
  bar.hidden = kind !== 'post';
  bar.style.transform = 'scaleX(0)';
  view.innerHTML = kind === 'home' ? homeHTML() : kind === 'post' ? postHTML(i) : editorHTML(i);
  view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  if (kind === 'home') mountHome(); else if (kind === 'post') mountPost(); else mountEditor(i);
  applyPerm();
}

function route() {
  var h = decodeURIComponent(location.hash.slice(1));
  if (h === 'write' || h.indexOf('edit-') === 0) {
    var es = h === 'write' ? null : h.slice(5);
    var ei = es ? POSTS.findIndex(function (p) { return p.slug === es; }) : -1;
    if (!es || ei >= 0) {
      if (current === 'home') listY = window.scrollY;
      show('edit', ei);
      window.scrollTo(0, 0);
      return;
    }
  }
  var i = POSTS.findIndex(function (p) { return p.slug === h; });
  if (i >= 0) {
    if (current === 'home') listY = window.scrollY;
    show('post', i);
    window.scrollTo(0, 0);
    return;
  }
  var wasPost = current === 'post' || current === 'edit';
  if (current !== 'home') show('home');
  if (h === 'about') {
    var a = $('#about');
    if (a) requestAnimationFrame(function () { a.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); });
  } else if (wasPost) {
    window.scrollTo(0, listY);
  } else {
    window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
  }
}

/* ---------- 滚动 ---------- */

function onScroll() {
  head.classList.toggle('stuck', window.scrollY > 8);
  if (current === 'home') {
    if (played) setReveal(Math.max(reveal, targetReveal()));
  } else if (current === 'post') {
    var a = $('.post', view);
    if (!a) return;
    var r = a.getBoundingClientRect();
    var p = clamp((-r.top) / Math.max(1, r.height - innerHeight * 0.55), 0, 1);
    bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    var idx = -1;
    $$('.prose h2', view).forEach(function (h, k) { if (h.getBoundingClientRect().top <= 120) idx = k; });
    $$('.toc li', view).forEach(function (li, k) { li.classList.toggle('on', k === idx); });
  }
}
var tick = false;
addEventListener('scroll', function () {
  if (tick) return;
  tick = true;
  requestAnimationFrame(function () { tick = false; onScroll(); });
}, { passive: true });

/* ---------- 主题、邮箱 ---------- */

var themeBtn = $('#theme');
function isDark() {
  var a = root.getAttribute('data-theme');
  return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
try {
  var saved = localStorage.getItem('theme');
  if (saved && !root.getAttribute('data-theme')) root.setAttribute('data-theme', saved);
} catch (e) {}
themeBtn.addEventListener('click', function () {
  var next = isDark() ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  themeBtn.classList.toggle('flip');
  try { localStorage.setItem('theme', next); } catch (e) {}
});
$('#cp').addEventListener('click', function () { copyText($('#cp'), EMAIL, $('#addr')); });

/* ---------- 启动 ---------- */

$('#foot').textContent = '© ' + new Date().getFullYear() + ' langrain';
try {
  var g = sessionStorage.getItem('goto');
  var c = sessionStorage.getItem('clear');
  if (c) { localStorage.removeItem(c); sessionStorage.removeItem('clear'); }
  if (g !== null) { sessionStorage.removeItem('goto'); location.hash = g; }
} catch (e) {}
addEventListener('hashchange', route);
addEventListener('resize', function () { if (current === 'home' && !rq) rq = requestAnimationFrame(function () { rq = 0; drawGraph(); }); });
route();
initCaps().then(function () { applyPerm(); if (current === 'edit') route(); });
if (GH) {
  /* 仓库里有 posts.json 就以它为准（读者看到的是它），没有就用页面里自带的这一份 */
  fetch('posts.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (Array.isArray(j)) { POSTS = j.map(prep); current = null; route(); } }, function () {});
}
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () { if (current === 'home') drawGraph(); });
}
})();
</script>

</body></html>
